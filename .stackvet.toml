[project]
name = "stackvet"
min_score = 90
strict = false

[thresholds]
fail_on = "error"
min_score = 90

[ci]
baseline = ".stackvet-baseline.json"
fail_on = "error"
strict = false

[ignore]
patterns = [
    "tests/fixtures/**",
    "target/**",
    "node_modules/**",
    "dist/**",
    "site/**",
    "scripts/**",
    "editors/vscode/out/**",
    "editors/vscode/bin/**",
]

[cache]
enabled = true
