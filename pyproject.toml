[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "stackvet"
dynamic = ["version"]
description = "Universal Project Health & Static Diagnostics Engine"
readme = "README.md"
authors = [{ name = "Inzamul Hoque" }]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = [
    "diagnostics",
    "fastapi",
    "sqlalchemy",
    "django",
    "celery",
    "react",
    "nextjs",
    "docker",
    "health",
    "linter",
    "ast",
    "static-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Bug Tracking",
]

[project.urls]
Homepage = "https://github.com/inzamol/stackvet"
Documentation = "https://inzamol.github.io/stackvet/"
Repository = "https://github.com/inzamol/stackvet"
Issues = "https://github.com/inzamol/stackvet/issues"

[tool.maturin]
manifest-path = "crates/stackvet-cli/Cargo.toml"
bindings = "bin"
strip = true
