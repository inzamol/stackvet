name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check version consistency
        run: node scripts/sync_version.js --check

      - name: Check code formatting
        run: cargo fmt --all --check

      - name: Run clippy linter
        run: cargo clippy --all-targets --all-features

      - name: Run test suite
        run: cargo test --all-targets --all-features

      - name: Install VS Code extension dependencies
        run: npm install --prefix editors/vscode

      - name: Run VS Code extension tests
        run: npm test --prefix editors/vscode

      - name: Run documentation tests
        run: cargo test --doc

      - name: Build release binary
        run: cargo build -p stackvet --release --locked

      - name: Bundle native binary for npm package
        run: node packages/npm/scripts/copy-binary.js

      - name: Run cross-platform smoke tests
        run: node scripts/smoke_test.js
