name: GitHub Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: stackvet-linux-x86_64
            binary_name: stackvet
            archive_ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: stackvet-macos-x86_64
            binary_name: stackvet
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: stackvet-macos-aarch64
            binary_name: stackvet
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: stackvet-windows-x86_64
            binary_name: stackvet.exe
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build -p stackvet --release --locked --target ${{ matrix.target }}

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          chmod +x "$BIN_PATH"
          cp "$BIN_PATH" "staging/${{ matrix.asset_name }}"
          cp README.md LICENSE staging/
          tar -czvf "${{ matrix.asset_name }}.tar.gz" -C staging "${{ matrix.asset_name }}" README.md LICENSE
          mkdir -p dist
          mv "${{ matrix.asset_name }}.tar.gz" dist/
          mv "staging/${{ matrix.asset_name }}" dist/

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          $binPath = "target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          Copy-Item $binPath "staging/${{ matrix.asset_name }}.exe"
          Copy-Item README.md staging/
          Copy-Item LICENSE staging/
          Compress-Archive -Path "staging/*" -DestinationPath "${{ matrix.asset_name }}.zip"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Move-Item "${{ matrix.asset_name }}.zip" dist/
          Move-Item "staging/${{ matrix.asset_name }}.exe" dist/

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_name }}
          path: dist/*
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: |
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release with Release Notes
        uses: softprops/action-gh-release@v2
        with:
          name: StackVet ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          body: |
            # 🚀 StackVet ${{ github.ref_name }}

            **StackVet** is a Universal Project Health & Static Diagnostics Engine — diagnose root causes across Python, Node.js, and Docker, and receive safe, automated remediations in milliseconds.

            ---

            ### 📦 Quick Installation

            #### 🟢 npm / npx (Node.js)
            ```bash
            # Run instantly without installing
            npx @inzamol/stackvet doctor

            # Or install globally
            npm install -g @inzamol/stackvet
            ```

            #### 🐍 pip / pipx (Python)
            ```bash
            # Install via pip
            pip install stackvet

            # Or run directly with pipx
            pipx run stackvet doctor
            ```

            #### 🦀 cargo (Rust)
            ```bash
            cargo install stackvet
            ```

            ---

            ### ⚡ Key Capabilities
            - **`stackvet doctor`** — Fast repository health diagnostics with scorecard and actionable breakdown.
            - **`stackvet check`** — Strict static analysis and CI/CD validation.
            - **`stackvet fix`** — Automated, AST-safe remediation for detected anomalies and anti-patterns.
            - **`stackvet explain <RULE-ID>`** — Detailed rationale, bad patterns, and recommended solutions.
            - **`stackvet graph`** — Multi-ecosystem dependency and architectural graph inspection.

            ---

            ### 📚 Documentation & Resources
            - 📖 **Documentation**: [https://inzamol.github.io/stackvet/](https://inzamol.github.io/stackvet/)
            - 📦 **npm**: [https://www.npmjs.com/package/@inzamol/stackvet](https://www.npmjs.com/package/@inzamol/stackvet)
            - 🐍 **PyPI**: [https://pypi.org/p/stackvet](https://pypi.org/p/stackvet)
